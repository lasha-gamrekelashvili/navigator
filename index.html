<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Iceberg</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05070d;
      --text: #e8f1f8;
      --muted: #7d8fa3;
      --cyan: #5ce6ff;
      --amber: #f5b942;
      --gold: #ffd56a;
      --win: #3ee08f;
      --lose: #ff4d5e;
      --glass: rgba(8, 12, 22, 0.58);
      --line: rgba(170, 205, 235, 0.18);
      --font: "Chakra Petch", system-ui, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 600;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    button, input { font-family: inherit; }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #6eb8e0;
    }

    .ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      z-index: 2;
    }

    .ui > * { pointer-events: auto; }
    .hero { pointer-events: none; }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
    }
    .flash.crash { animation: flashRed 0.5s ease-out; }
    .flash.win { animation: flashGreen 0.45s ease-out; }
    .flash.bonus { animation: flashGold 0.45s ease-out; }

    @keyframes flashRed {
      0% { opacity: 1; background: radial-gradient(ellipse at 50% 55%, rgba(255, 50, 70, 0.28), transparent 60%); }
      100% { opacity: 0; }
    }
    @keyframes flashGreen {
      0% { opacity: 1; background: radial-gradient(ellipse at 50% 45%, rgba(62, 224, 143, 0.22), transparent 55%); }
      100% { opacity: 0; }
    }
    @keyframes flashGold {
      0% { opacity: 1; background: radial-gradient(ellipse at 50% 50%, rgba(255, 213, 106, 0.3), transparent 55%); }
      100% { opacity: 0; }
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 0;
    }

    .brand {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--cyan);
      padding: 7px 10px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .history {
      display: flex;
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      padding: 2px 2px 6px;
    }
    .history::-webkit-scrollbar { display: none; }

    .pill {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      animation: pillIn 0.28s ease-out;
    }
    .pill.win { color: var(--win); background: rgba(62, 224, 143, 0.12); border-color: rgba(62, 224, 143, 0.28); }
    .pill.lose { color: var(--lose); background: rgba(255, 77, 94, 0.12); border-color: rgba(255, 77, 94, 0.28); }

    @keyframes pillIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--glass);
      color: var(--text);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      font-size: 14px;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { border-color: rgba(92, 230, 255, 0.4); }
    .icon-btn.muted { color: var(--muted); }

    .bal {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 5px 12px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      min-width: 96px;
    }
    .bal small {
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    .bal b {
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
      line-height: 1.15;
    }
    .bal.bump b { animation: bump 0.35s ease; }

    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .mid {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    .live {
      position: absolute;
      top: 8px;
      left: 10px;
      width: auto;
      max-width: min(250px, 78vw);
      max-height: calc(100% - 16px);
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px) saturate(1.15);
      -webkit-backdrop-filter: blur(16px) saturate(1.15);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.28);
      overflow: hidden;
      z-index: 4;
    }
    .live.open { width: min(250px, 78vw); }

    .live-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      padding: 9px 12px;
      text-align: left;
      cursor: pointer;
    }
    .live-toggle span { color: var(--cyan); margin-left: 6px; font-variant-numeric: tabular-nums; }

    .live-body {
      display: none;
      overflow-y: auto;
      padding: 0 8px 8px;
      max-height: 42vh;
    }
    .live.open .live-body { display: block; }

    .live-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 6px 6px;
      border-radius: 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .live-row:nth-child(odd) { background: rgba(255, 255, 255, 0.03); }
    .live-row .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .live-row .amt { color: var(--muted); }
    .live-row .res { color: var(--muted); min-width: 48px; text-align: right; }
    .live-row.out .res { color: var(--win); }
    .live-row.crash .res { color: var(--lose); }
    .live-row.out { animation: rowFlash 0.35s ease; }

    @keyframes rowFlash {
      from { background: rgba(62, 224, 143, 0.18); }
    }

    .hero {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px 6vh;
    }

    .mult {
      font-size: clamp(58px, 17vw, 124px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.045em;
      line-height: 0.92;
      color: var(--cyan);
      text-shadow: 0 0 22px rgba(92, 230, 255, 0.35), 0 10px 40px rgba(0, 0, 0, 0.45);
      transition: color 90ms linear, text-shadow 90ms linear;
    }
    .mult.idle { color: #0d5f88; text-shadow: 0 2px 14px rgba(255, 255, 255, 0.4); }
    .mult.high { color: var(--amber); text-shadow: 0 0 26px rgba(245, 185, 66, 0.45); }
    .mult.hot { color: #fff4d6; text-shadow: 0 0 30px rgba(255, 213, 106, 0.55); }
    .mult.win { color: var(--win); text-shadow: 0 0 28px rgba(62, 224, 143, 0.5); }
    .mult.lose {
      color: var(--lose);
      text-shadow: 0 0 28px rgba(255, 77, 94, 0.55);
      animation: crashShake 0.45s ease;
    }

    @keyframes crashShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .sub {
      margin-top: 10px;
      min-height: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.35);
    }
    .sub.win { color: var(--win); }
    .sub.lose { color: var(--lose); }

    .bonuses {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
      min-height: 24px;
    }
    .bchip {
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(245, 185, 66, 0.16);
      border: 1px solid rgba(245, 185, 66, 0.42);
      color: var(--amber);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      animation: pillIn 0.28s ease-out;
    }

    .bonus-toast {
      position: absolute;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(20px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-shadow: 0 0 22px rgba(255, 213, 106, 0.65);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .bonus-toast.show { animation: bonusPop 1.15s ease-out; }

    @keyframes bonusPop {
      0% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.78); }
      16% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.08); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-18px) scale(1); }
    }

    .panel {
      margin: 0 10px calc(10px + env(safe-area-inset-bottom));
      padding: 12px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }

    .row { display: flex; gap: 8px; align-items: stretch; }
    .row + .row { margin-top: 8px; }

    .stepper {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
      height: 48px;
    }
    .step {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .step svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .step:hover { color: var(--cyan); border-color: rgba(92, 230, 255, 0.45); background: rgba(92, 230, 255, 0.08); }
    .step:active { transform: scale(0.96); }
    .step:disabled { opacity: 0.35; cursor: default; transform: none; }
    .bet-field {
      display: flex;
      align-items: center;
      min-width: 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(4, 8, 16, 0.55);
    }
    .bet-field input {
      width: 100%;
      height: 48px;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .chip:hover { border-color: rgba(245, 185, 66, 0.5); color: var(--amber); }
    .chip:active { transform: scale(0.95); }
    .chip:disabled { opacity: 0.35; cursor: default; }

    .auto {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    .auto-field {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(4, 8, 16, 0.45);
    }
    .auto-field span {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      white-space: nowrap;
    }
    .auto-field input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(4, 8, 16, 0.45);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    .toggle input { display: none; }
    .toggle i {
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: #2a3344;
      position: relative;
      flex: 0 0 auto;
    }
    .toggle i::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #c5d0dc;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .toggle.on { color: var(--cyan); border-color: rgba(92, 230, 255, 0.35); }
    .toggle.on i { background: rgba(92, 230, 255, 0.35); }
    .toggle.on i::after { transform: translateX(16px); background: var(--cyan); }

    .action {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.08s ease, filter 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .action small {
      font-size: 10px;
      letter-spacing: 0.16em;
      opacity: 0.72;
    }
    .action b {
      font-size: 20px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .action:active:not(:disabled) { transform: scale(0.98); }
    .action:disabled { cursor: default; filter: saturate(0.4); }

    .action.bet {
      background: linear-gradient(180deg, #ffd56a, var(--amber));
      color: #2a1a05;
      box-shadow: 0 8px 24px rgba(245, 185, 66, 0.28);
    }
    .action.bet:hover:not(:disabled) { filter: brightness(1.06); }

    .action.run {
      background: linear-gradient(180deg, #62f0a8, #2fd37a);
      color: #052214;
      box-shadow: 0 0 0 0 rgba(62, 224, 143, 0.55);
      animation: pulse 1.1s ease-out infinite;
    }

    .action.win { background: #1e3d30; color: var(--win); }
    .action.lose { background: #3a1c22; color: var(--lose); }
    .action.wait { background: #1a2230; color: var(--muted); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(62, 224, 143, 0.45); }
      70% { box-shadow: 0 0 0 12px rgba(62, 224, 143, 0); }
      100% { box-shadow: 0 0 0 0 rgba(62, 224, 143, 0); }
    }

    @media (min-width: 820px) {
      .live, .live.open { width: 260px; }
      .live .live-body { display: block; max-height: 52vh; }
      .hero { padding-bottom: 2vh; }
      .panel { max-width: 720px; margin-left: auto; margin-right: auto; width: calc(100% - 40px); }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="flash" id="flash"></div>

  <div class="ui">
    <header>
      <div class="brand">ICEBERG</div>
      <div class="history" id="history"></div>
      <div class="top-right">
        <button class="icon-btn" id="mute" type="button" aria-label="Mute">♪</button>
        <div class="bal" id="balWrap"><small>BALANCE</small><b id="balance">1000.00</b></div>
      </div>
    </header>

    <div class="mid">
      <aside class="live" id="live">
        <button class="live-toggle" id="liveToggle" type="button">LIVE BETS <span id="liveCount">0</span></button>
        <div class="live-body" id="liveBody"></div>
      </aside>

      <div class="hero">
        <div class="bonus-toast" id="bonusToast"></div>
        <div class="mult idle" id="mult">1.00x</div>
        <div class="sub" id="status">PLACE YOUR BET</div>
        <div class="bonuses" id="bonuses"></div>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <div class="stepper">
          <button class="step" type="button" id="betMinus" aria-label="Decrease bet">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <div class="bet-field">
            <input id="bet" type="number" min="1" step="1" value="10" inputmode="decimal" />
          </div>
          <button class="step" type="button" id="betPlus" aria-label="Increase bet">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <div class="row chips" id="chips">
        <button class="chip" data-add="1" type="button">+1</button>
        <button class="chip" data-add="5" type="button">+5</button>
        <button class="chip" data-add="10" type="button">+10</button>
        <button class="chip" data-add="100" type="button">+100</button>
        <button class="chip" data-act="half" type="button">½</button>
        <button class="chip" data-act="double" type="button">×2</button>
        <button class="chip" data-act="max" type="button">MAX</button>
      </div>
      <div class="row auto">
        <label class="auto-field">
          <span>AUTO C/O</span>
          <input id="auto" type="number" min="1.01" step="0.01" placeholder="off" inputmode="decimal" />
        </label>
        <label class="toggle" id="autoBetLab">
          <input id="autoBet" type="checkbox" />
          <i></i>
          AUTO BET
        </label>
      </div>
      <div class="row">
        <button class="action bet" id="action" type="button"><small>PLACE BET</small><b>10.00</b></button>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // TWEAKABLES
    // ---------------------------------------------------------------------------
    const HOUSE_EDGE = 0.03;           // 3% house edge → ~97% RTP
    const DEMO_FORCE_CRASH = 0;       // set to 0 to restore real random crash math
    const CLIMB_BASE = 1.00022;        // multiplier = CLIMB_BASE ^ elapsedMs
                                       // 1.00022 ≈ 2x in ~3.15s; 1.0007 ≈ 1.0s
    const STARTING_BALANCE = 1000;
    const MIN_BET = 1;
    const HISTORY_LIMIT = 15;
    const POST_ROUND_PAUSE_MS = 1500;
    const ICEBERG_RISE_MS = 420;
    const ESCAPE_MS = 880;
    const AUTO_BET_DELAY_MS = 420;
    const SEA_SURFACE = 0.58;
    const SHIP_SWELL_PX = 6.5;     // long swell the hull rides
    const WAVE_AMP_PX = 2.4;       // surface height; kept at lobby calm
    const WAVE_SPEED = 0.55;       // wave scroll; kept at lobby calm
    const SHAKE_START = 16;
    const BONUS_MAX = 2;               // at most this many bonus bergs per round
    const BONUS_CHANCE = 0.62;         // chance a round gets at least one bonus berg

    const COL = {
      cyan: "#5ce6ff",
      white: "#f4fbff",
      amber: "#f5b942",
      win: "#3ee08f",
      lose: "#ff4d5e"
    };

    // ---------------------------------------------------------------------------
    // DOM
    // ---------------------------------------------------------------------------
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const flashEl = document.getElementById("flash");
    const historyEl = document.getElementById("history");
    const muteBtn = document.getElementById("mute");
    const balWrap = document.getElementById("balWrap");
    const balanceEl = document.getElementById("balance");
    const liveEl = document.getElementById("live");
    const liveToggle = document.getElementById("liveToggle");
    const liveBody = document.getElementById("liveBody");
    const liveCount = document.getElementById("liveCount");
    const multEl = document.getElementById("mult");
    const statusEl = document.getElementById("status");
    const betInput = document.getElementById("bet");
    const autoInput = document.getElementById("auto");
    const autoBetLab = document.getElementById("autoBetLab");
    const autoBetBox = document.getElementById("autoBet");
    const actionBtn = document.getElementById("action");
    const bonusesEl = document.getElementById("bonuses");
    const bonusToast = document.getElementById("bonusToast");

    // ---------------------------------------------------------------------------
    // STATE  (in-memory only — no localStorage)
    // ---------------------------------------------------------------------------
    const STATE = { BETTING: "BETTING", RUNNING: "RUNNING", CRASHED: "CRASHED", WON: "WON" };

    let state = STATE.BETTING;
    let balance = STARTING_BALANCE;
    let balanceShown = STARTING_BALANCE;
    let betAmount = 10;
    let crashMultiplier = 1;
    let currentMultiplier = 1;
    let lastPayout = 0;
    let history = [];
    let liveBets = [];
    let autoBet = false;
    let muted = false;
    let autoTimer = 0;

    let roundStartMs = 0;
    let stateSinceMs = 0;
    let lastTs = 0;
    let timeSec = 0;
    let dpr = 1, W = 0, H = 0;

    let animFromX = 0.18;
    let ship = { x: 0.18, rot: 0, sink: 0, heave: 0, pitch: 0 };
    let iceberg = { rise: 0, x: 0.62 };
    let shake = 0;
    let splashSpawned = false;
    const particles = [];
    const wake = [];
    const floes = [];
    const clouds = [];
    let lightning = 0;
    let bolt = null;
    let bonusEvents = [];
    let bonusStack = 1;
    let collectedBonuses = [];

    const NAMES = [
      "nova_42", "k1t", "frost", "luna", "rex9", "ivy", "echo", "milo",
      "zara", "odin", "nori", "jax", "vera", "koi", "ash", "pxl",
      "orin", "sage", "nyx", "cleo", "riven", "tao", "hex", "opal",
      "drift", "vale", "knox", "remy", "sol", "quin"
    ];

    // ---------------------------------------------------------------------------
    // AUDIO  (synthesized, no files)
    // ---------------------------------------------------------------------------
    let audioCtx = null;
    let riseOsc = null;
    let riseGain = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function beep(freq, dur, type, vol, slide) {
      if (muted || !audioCtx) return;
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    function startRiseTone() {
      stopRiseTone();
      if (muted || !audioCtx) return;
      riseOsc = audioCtx.createOscillator();
      riseGain = audioCtx.createGain();
      riseOsc.type = "sine";
      riseOsc.frequency.value = 180;
      riseGain.gain.value = 0.028;
      riseOsc.connect(riseGain);
      riseGain.connect(audioCtx.destination);
      riseOsc.start();
    }

    function updateRiseTone(mult) {
      if (!riseOsc || !audioCtx) return;
      const f = 170 + Math.log(mult) * 90;
      riseOsc.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.04);
    }

    function stopRiseTone() {
      if (riseOsc) {
        try { riseOsc.stop(); } catch (e) {}
        riseOsc.disconnect();
        riseOsc = null;
        riseGain = null;
      }
    }

    function soundCash() { beep(880, 0.12, "sine", 0.07, 1320); beep(1320, 0.16, "triangle", 0.04, 1760); }
    function soundCrash() { beep(90, 0.28, "sine", 0.12, 40); beep(160, 0.18, "triangle", 0.06, 70); }
    function soundBonus() { beep(620, 0.1, "sine", 0.06, 880); beep(990, 0.16, "triangle", 0.05, 1480); }

    muteBtn.addEventListener("click", () => {
      muted = !muted;
      muteBtn.classList.toggle("muted", muted);
      muteBtn.textContent = muted ? "×" : "♪";
      if (muted) stopRiseTone();
      else unlockAudio();
    });

    // ---------------------------------------------------------------------------
    // MATH
    // ---------------------------------------------------------------------------
    function generateCrashMultiplier() {
      if (DEMO_FORCE_CRASH > 0) return DEMO_FORCE_CRASH;
      let u = Math.random();
      if (u < 1e-12) u = 1e-12;
      return Math.max(1.00, (1 - HOUSE_EDGE) / u);
    }

    function formatMult(n) { return n.toFixed(2) + "x"; }
    function formatMoney(n) { return n.toFixed(2); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeOutBack(t) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function parseBet() {
      const n = Number(betInput.value);
      if (!Number.isFinite(n)) return MIN_BET;
      return clamp(Math.round(n * 100) / 100, MIN_BET, 1e9);
    }

    function parseAuto() {
      const raw = autoInput.value.trim();
      if (!raw) return 0;
      const n = Number(raw);
      return Number.isFinite(n) && n > 1 ? n : 0;
    }

    function setBet(n) {
      betAmount = clamp(Math.round(n * 100) / 100, MIN_BET, 1e9);
      betInput.value = String(betAmount);
      if (state === STATE.BETTING) paintAction();
    }

    // ---------------------------------------------------------------------------
    // UI
    // ---------------------------------------------------------------------------
    function setAction(kind, top, bot, disabled) {
      actionBtn.classList.remove("bet", "run", "win", "lose", "wait");
      actionBtn.classList.add(kind);
      actionBtn.disabled = !!disabled;
      actionBtn.innerHTML = "<small>" + top + "</small><b>" + bot + "</b>";
    }

    function paintAction() {
      const bet = parseBet();
      if (state === STATE.BETTING) {
        if (balance < MIN_BET) setAction("bet", "BALANCE EMPTY", "REFILL 1000");
        else setAction("bet", "PLACE BET", formatMoney(bet));
      } else if (state === STATE.RUNNING) {
        const pot = betAmount * currentMultiplier * bonusStack;
        const tag = bonusStack > 1
          ? formatMoney(pot) + "  (" + formatMult(currentMultiplier) + " × " + formatMult(bonusStack) + ")"
          : formatMoney(pot) + "  (" + formatMult(currentMultiplier) + ")";
        setAction("run", "CASH OUT", tag);
      } else if (state === STATE.WON) {
        setAction("win", "WON", "+" + formatMoney(lastPayout), true);
      } else {
        setAction("lose", "CRASHED", formatMult(crashMultiplier), true);
      }
    }

    function shipHome() {
      return window.innerWidth >= 820 ? 0.36 : 0.18;
    }

    function setMultLook() {
      multEl.className = "mult";
      if (state === STATE.BETTING) {
        multEl.classList.add("idle");
      } else if (state === STATE.WON) {
        multEl.classList.add("win");
      } else if (state === STATE.CRASHED) {
        multEl.classList.add("lose");
      } else if (currentMultiplier >= 10) {
        multEl.classList.add("hot");
      } else if (currentMultiplier >= 3) {
        multEl.classList.add("high");
      }
      if (state === STATE.RUNNING) {
        if (currentMultiplier < 3) {
          const day = tension() < 0.35;
          multEl.style.color = day ? "#0c6a98" : COL.cyan;
          multEl.style.textShadow = day
            ? "0 2px 12px rgba(255,255,255,0.45)"
            : "0 0 22px rgba(92,230,255,0.4)";
        } else if (currentMultiplier < 10) {
          multEl.style.color = lerpColor(COL.white, COL.amber, (currentMultiplier - 3) / 7);
          multEl.style.textShadow = "0 0 26px rgba(245,185,66,0.4)";
        } else {
          multEl.style.color = COL.amber;
          multEl.style.textShadow = "0 0 30px rgba(255,213,106,0.55)";
        }
      } else {
        multEl.style.color = "";
        multEl.style.textShadow = "";
      }
    }

    function lerpColor(a, b, t) {
      const pa = hexToRgb(a), pb = hexToRgb(b);
      const r = Math.round(lerp(pa[0], pb[0], t));
      const g = Math.round(lerp(pa[1], pb[1], t));
      const bl = Math.round(lerp(pa[2], pb[2], t));
      return "rgb(" + r + "," + g + "," + bl + ")";
    }

    function hexToRgb(h) {
      const n = h.replace("#", "");
      return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
    }

    function setHud() {
      const betting = state === STATE.BETTING;
      betInput.disabled = !betting;
      document.querySelectorAll(".chip").forEach((c) => { c.disabled = !betting; });
      document.getElementById("betMinus").disabled = !betting;
      document.getElementById("betPlus").disabled = !betting;

      multEl.textContent = formatMult(currentMultiplier);
      setMultLook();
      paintAction();

      statusEl.className = "sub";
      if (state === STATE.BETTING) {
        statusEl.textContent = balance < MIN_BET ? "BALANCE EMPTY" : "PLACE YOUR BET";
      } else if (state === STATE.RUNNING) {
        statusEl.textContent = bonusStack > 1 ? "SAILING  ·  BONUS " + formatMult(bonusStack) : "SAILING";
      } else if (state === STATE.WON) {
        statusEl.classList.add("win");
        statusEl.textContent = "CASHED OUT  +" + formatMoney(lastPayout);
      } else {
        statusEl.classList.add("lose");
        statusEl.textContent = "CRASHED";
      }
    }

    function bumpBalance() {
      balWrap.classList.remove("bump");
      void balWrap.offsetWidth;
      balWrap.classList.add("bump");
    }

    function renderHistory() {
      historyEl.innerHTML = "";
      history.forEach((h) => {
        const el = document.createElement("div");
        el.className = "pill " + (h.won ? "win" : "lose");
        el.textContent = formatMult(h.crash);
        historyEl.appendChild(el);
      });
    }

    function pushHistory(won) {
      history.unshift({ crash: crashMultiplier, won: won });
      if (history.length > HISTORY_LIMIT) history.pop();
      renderHistory();
    }

    function flash(kind) {
      flashEl.className = "flash " + kind;
      flashEl.addEventListener("animationend", () => { flashEl.className = "flash"; }, { once: true });
    }

    function setControlsLocked(on) {
      betInput.disabled = on;
      document.querySelectorAll(".chip, #betMinus, #betPlus").forEach((c) => { c.disabled = on; });
    }

    function pickBonus() {
      const r = Math.random();
      if (r < 0.55) return 1.5;
      if (r < 0.88) return 2;
      return 3;
    }

    function scheduleBonuses() {
      bonusEvents = [];
      bonusStack = 1;
      collectedBonuses = [];
      renderBonuses();
      if (crashMultiplier <= 1.2) return;
      if (Math.random() > BONUS_CHANCE) return;
      const count = Math.random() < 0.35 ? 2 : 1;
      const span = Math.min(crashMultiplier - 1.12, 14);
      if (span < 0.2) return;
      for (let i = 0; i < Math.min(count, BONUS_MAX); i++) {
        const at = 1.12 + Math.random() * span * 0.82;
        if (at >= crashMultiplier - 0.06) continue;
        bonusEvents.push({
          at: at,
          mult: pickBonus(),
          phase: "idle",
          rise: 0,
          x: 0,
          since: 0
        });
      }
      bonusEvents.sort((a, b) => a.at - b.at);
    }

    function renderBonuses() {
      bonusesEl.innerHTML = "";
      collectedBonuses.forEach((n) => {
        const el = document.createElement("div");
        el.className = "bchip";
        el.textContent = formatMult(n);
        bonusesEl.appendChild(el);
      });
    }

    function showBonusToast(n) {
      bonusToast.textContent = "BONUS  " + formatMult(n);
      bonusToast.classList.remove("show");
      void bonusToast.offsetWidth;
      bonusToast.classList.add("show");
      bonusToast.addEventListener("animationend", () => bonusToast.classList.remove("show"), { once: true });
    }

    function applyBonus(ev) {
      bonusStack *= ev.mult;
      collectedBonuses.push(ev.mult);
      renderBonuses();
      showBonusToast(ev.mult);
      flash("bonus");
      soundBonus();
      spawnSparkles(ev.x * W, waterY() - 16);
      spawnSplash(ev.x * W, waterY());
      shake = 6;
      if (state === STATE.RUNNING) {
        statusEl.textContent = "SAILING  ·  BONUS " + formatMult(bonusStack);
        paintAction();
      }
    }

    function seedFloes() {
      floes.length = 0;
      for (let i = 0; i < 8; i++) {
        floes.push({
          x: Math.random(),
          z: 0.15 + Math.random() * 0.8,
          w: 0.022 + Math.random() * 0.05,
          h: 0.022 + Math.random() * 0.06,
          phase: Math.random() * Math.PI * 2,
          speed: 0.006 + Math.random() * 0.016,
          jagged: Math.random()
        });
      }
    }

    function seedClouds() {
      clouds.length = 0;
      for (let i = 0; i < 6; i++) {
        clouds.push({
          x: Math.random(),
          y: 0.06 + Math.random() * 0.26,
          w: 0.14 + Math.random() * 0.2,
          h: 0.045 + Math.random() * 0.04,
          speed: 0.003 + Math.random() * 0.007
        });
      }
    }

    // ---------------------------------------------------------------------------
    // LIVE BETS  (fake social feed)
    // ---------------------------------------------------------------------------
    function seedLiveBets() {
      const n = 8 + Math.floor(Math.random() * 6);
      const used = new Set();
      liveBets = [];
      for (let i = 0; i < n; i++) {
        let name = NAMES[Math.floor(Math.random() * NAMES.length)];
        while (used.has(name)) name = NAMES[Math.floor(Math.random() * NAMES.length)] + Math.floor(Math.random() * 90);
        used.add(name);
        const bet = [2, 5, 10, 20, 25, 50, 75, 100, 150, 250][Math.floor(Math.random() * 10)];
        const cashAt = 1.01 + Math.pow(Math.random(), 1.6) * 12;
        liveBets.push({ name: name, bet: bet, cashAt: cashAt, status: "pending", out: 0 });
      }
      renderLive();
    }

    function updateLiveBets(mult, crashed) {
      let dirty = false;
      liveBets.forEach((p) => {
        if (p.status !== "pending") return;
        if (p.cashAt < crashMultiplier && mult >= p.cashAt) {
          p.status = "out";
          p.out = p.cashAt;
          dirty = true;
        } else if (crashed) {
          p.status = "crash";
          dirty = true;
        }
      });
      if (dirty) renderLive();
    }

    function renderLive() {
      liveCount.textContent = String(liveBets.length);
      liveBody.innerHTML = "";
      const frag = document.createDocumentFragment();
      liveBets.forEach((p) => {
        const row = document.createElement("div");
        row.className = "live-row " + (p.status === "out" ? "out" : p.status === "crash" ? "crash" : "");
        const res = p.status === "out" ? formatMult(p.out) : p.status === "crash" ? "—" : "…";
        row.innerHTML = "<span class='name'>" + p.name + "</span><span class='amt'>" + formatMoney(p.bet) + "</span><span class='res'>" + res + "</span>";
        frag.appendChild(row);
      });
      liveBody.appendChild(frag);
    }

    let liveWasWide = window.innerWidth >= 820;
    function syncLiveOpen() {
      const wide = window.innerWidth >= 820;
      if (wide && !liveWasWide) liveEl.classList.add("open");
      if (!wide && liveWasWide) liveEl.classList.remove("open");
      if (wide) liveEl.classList.add("open");
      liveWasWide = wide;
    }
    liveToggle.addEventListener("click", () => liveEl.classList.toggle("open"));
    window.addEventListener("resize", syncLiveOpen);
    syncLiveOpen();

    // ---------------------------------------------------------------------------
    // ROUND LIFECYCLE
    // ---------------------------------------------------------------------------
    function startRound() {
      if (state !== STATE.BETTING) return;
      unlockAudio();

      if (balance < MIN_BET) {
        balance = STARTING_BALANCE;
        bumpBalance();
        setHud();
        return;
      }

      const bet = parseBet();
      if (bet > balance) {
        statusEl.textContent = "NOT ENOUGH BALANCE";
        return;
      }

      betAmount = bet;
      balance -= betAmount;
      bumpBalance();

      crashMultiplier = generateCrashMultiplier();
      currentMultiplier = 1.00;
      scheduleBonuses();

      ship.x = shipHome();
      ship.rot = 0;
      ship.sink = 0;
      iceberg.rise = 0;
      iceberg.x = 0.6;
      shake = 0;
      splashSpawned = false;
      particles.length = 0;
      wake.length = 0;

      seedLiveBets();
      state = STATE.RUNNING;
      roundStartMs = performance.now();
      stateSinceMs = roundStartMs;
      setControlsLocked(true);
      setHud();
      startRiseTone();

      if (crashMultiplier <= 1.00) triggerCrash();
    }

    function cashOut() {
      if (state !== STATE.RUNNING) return;
      lastPayout = Math.round(betAmount * currentMultiplier * bonusStack * 100) / 100;
      balance += lastPayout;
      animFromX = ship.x;
      state = STATE.WON;
      stateSinceMs = performance.now();
      stopRiseTone();
      soundCash();
      spawnSparkles(ship.x * W, waterY() - 20);
      pushHistory(true);
      bumpBalance();
      flash("win");
      setHud();
    }

    function triggerCrash() {
      if (state !== STATE.RUNNING) return;
      currentMultiplier = crashMultiplier;
      iceberg.x = clamp(ship.x + 0.08, 0.2, 0.86);
      state = STATE.CRASHED;
      stateSinceMs = performance.now();
      shake = SHAKE_START;
      stopRiseTone();
      soundCrash();
      updateLiveBets(currentMultiplier, true);
      pushHistory(false);
      flash("crash");
      setHud();
    }

    function returnToBetting() {
      state = STATE.BETTING;
      currentMultiplier = 1.00;
      bonusStack = 1;
      collectedBonuses = [];
      bonusEvents = [];
      renderBonuses();
      ship.x = shipHome();
      ship.rot = 0;
      ship.sink = 0;
      iceberg.rise = 0;
      shake = 0;
      splashSpawned = false;
      setControlsLocked(false);
      setHud();

      if (autoBet && balance >= parseBet()) {
        clearTimeout(autoTimer);
        autoTimer = setTimeout(() => {
          if (state === STATE.BETTING && autoBet) startRound();
        }, AUTO_BET_DELAY_MS);
      }
    }

    actionBtn.addEventListener("click", () => {
      if (state === STATE.BETTING) startRound();
      else if (state === STATE.RUNNING) cashOut();
    });

    document.getElementById("betMinus").addEventListener("click", () => setBet(parseBet() - 1));
    document.getElementById("betPlus").addEventListener("click", () => setBet(parseBet() + 1));
    betInput.addEventListener("input", () => { if (state === STATE.BETTING) paintAction(); });

    document.getElementById("chips").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn || state !== STATE.BETTING) return;
      const add = Number(btn.dataset.add);
      if (add) { setBet(parseBet() + add); return; }
      if (btn.dataset.act === "half") setBet(parseBet() / 2);
      if (btn.dataset.act === "double") setBet(parseBet() * 2);
      if (btn.dataset.act === "max") setBet(Math.max(MIN_BET, Math.floor(balance)));
    });

    autoBetBox.addEventListener("change", () => {
      autoBet = autoBetBox.checked;
      autoBetLab.classList.toggle("on", autoBet);
    });

    document.addEventListener("keydown", (e) => {
      if (e.code !== "Space") return;
      if (document.activeElement === betInput || document.activeElement === autoInput) return;
      e.preventDefault();
      if (state === STATE.RUNNING) cashOut();
      else if (state === STATE.BETTING) startRound();
    });

    // ---------------------------------------------------------------------------
    // PARTICLES / WAKE
    // ---------------------------------------------------------------------------
    function spawnSplash(x, y) {
      for (let i = 0; i < 40; i++) {
        const a = -Math.PI * 0.12 - Math.random() * Math.PI * 0.76;
        const sp = 90 + Math.random() * 300;
        particles.push({
          x: x + (Math.random() - 0.5) * 46,
          y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 0.5 + Math.random() * 0.5,
          max: 0.85,
          r: 1.4 + Math.random() * 3.4,
          gold: false
        });
      }
    }

    function spawnSparkles(x, y) {
      for (let i = 0; i < 28; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 180;
        particles.push({
          x: x, y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 40,
          life: 0.4 + Math.random() * 0.5,
          max: 0.75,
          r: 1.2 + Math.random() * 2.2,
          gold: true
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.vy += (p.gold ? 180 : 520) * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = wake.length - 1; i >= 0; i--) {
        const w = wake[i];
        w.life -= dt;
        w.x += (w.vx || 0) * dt;
        w.y += (w.vy || 0) * dt;
        w.r += 7 * dt;
        if (w.life <= 0) wake.splice(i, 1);
      }
    }

    // ---------------------------------------------------------------------------
    // CANVAS SCENE
    // ---------------------------------------------------------------------------
    function resize() {
      const w = Math.max(1, Math.floor(window.innerWidth * Math.min(devicePixelRatio || 1, 2)));
      const h = Math.max(1, Math.floor(window.innerHeight * Math.min(devicePixelRatio || 1, 2)));
      dpr = w / window.innerWidth;
      if (w === W && h === H) return;
      W = w; H = h;
      canvas.width = W;
      canvas.height = H;
    }

    window.addEventListener("resize", resize);

    function waterY() { return H * SEA_SURFACE; }

    function sailWind() {
      if (state === STATE.RUNNING) return 1;
      if (state === STATE.WON) return 1.25;
      if (state === STATE.CRASHED) return 0.12;
      return 0.42;
    }

    function swellAt(x) {
      const a = SHIP_SWELL_PX * dpr;
      const ride = state === STATE.RUNNING || state === STATE.WON ? 1.12 : 1;
      return Math.sin(x * 0.0038 / dpr + timeSec * 0.92) * a * ride
        + Math.sin(x * 0.0074 / dpr + timeSec * 1.28 + 1.15) * a * 0.38 * ride
        + Math.sin(x * 0.0062 / dpr + timeSec * WAVE_SPEED) * WAVE_AMP_PX * dpr;
    }

    function swellSlope(x) {
      const a = SHIP_SWELL_PX * dpr;
      const ride = state === STATE.RUNNING || state === STATE.WON ? 1.12 : 1;
      return Math.cos(x * 0.0038 / dpr + timeSec * 0.92) * (0.0038 / dpr) * a * ride
        + Math.cos(x * 0.0074 / dpr + timeSec * 1.28 + 1.15) * (0.0074 / dpr) * a * 0.38 * ride
        + Math.cos(x * 0.0062 / dpr + timeSec * WAVE_SPEED) * (0.0062 / dpr) * WAVE_AMP_PX * dpr;
    }

    function updateShipRide(dt) {
      const x = ship.x * W;
      const wind = sailWind();
      const targetHeave = swellAt(x);
      const targetPitch = Math.atan(swellSlope(x)) * 0.72
        + Math.sin(timeSec * 0.88) * 0.018 * (0.55 + wind)
        + (state === STATE.RUNNING ? 0.03 * Math.sin(timeSec * 0.55) : 0);
      const follow = state === STATE.CRASHED ? 2.4 : 5.4;
      ship.heave += (targetHeave - ship.heave) * Math.min(1, dt * follow);
      if (state !== STATE.CRASHED) {
        ship.pitch += (targetPitch - ship.pitch) * Math.min(1, dt * 4.1);
      }
    }

    function spawnSailingWake() {
      const moving = state === STATE.RUNNING || state === STATE.WON;
      const x = ship.x * W;
      const y = waterY() + ship.heave + 5 * dpr;
      const sides = moving ? [-1, 1] : [0];
      sides.forEach((side) => {
        wake.push({
          x: x - 18 * dpr + (Math.random() - 0.5) * 8 * dpr,
          y: y + side * (moving ? 6 : 1) * dpr,
          vx: moving ? -20 - Math.random() * 18 : -7,
          vy: side * (moving ? 11 + Math.random() * 8 : 0),
          life: moving ? 0.9 : 0.5,
          max: moving ? 0.9 : 0.5,
          r: 3.2 + Math.random() * 3.4
        });
      });
      if (moving && Math.random() < 0.4) {
        particles.push({
          x: x + 20 * dpr,
          y: y - 3 * dpr,
          vx: 10 + Math.random() * 18,
          vy: -10 - Math.random() * 16,
          life: 0.22 + Math.random() * 0.18,
          max: 0.38,
          r: 1 + Math.random() * 1.5,
          gold: false
        });
      }
    }

    function tension() {
      if (state === STATE.BETTING) return 0;
      const m = Math.max(1, currentMultiplier);
      const t = clamp(Math.log(m) / Math.log(10), 0, 1);
      if (state === STATE.CRASHED) return Math.max(t, 0.7);
      return t;
    }

    function mixTone(calm, storm) {
      return lerpColor(calm, storm, tension());
    }

    function drawSky() {
      const ten = tension();
      const g = ctx.createLinearGradient(0, 0, 0, waterY());
      g.addColorStop(0, mixTone("#8fd4f2", "#12151c"));
      g.addColorStop(0.42, mixTone("#5eb6e4", "#1a2433"));
      g.addColorStop(1, mixTone("#9fd0e6", "#2a2e36"));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      const sx = W * 0.78, sy = H * 0.13;
      const sun = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.22);
      sun.addColorStop(0, "rgba(255, 244, 210, " + (0.95 * (1 - ten)) + ")");
      sun.addColorStop(0.28, "rgba(255, 220, 140, " + (0.35 * (1 - ten)) + ")");
      sun.addColorStop(1, "rgba(255, 220, 140, 0)");
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, W, waterY());

      clouds.forEach((c) => {
        const x = ((c.x % 1) + 1) % 1 * W;
        const y = c.y * waterY();
        const cw = c.w * W;
        const ch = c.h * H;
        ctx.fillStyle = ten < 0.45
          ? "rgba(255,255,255," + (0.55 - ten * 0.2) + ")"
          : "rgba(" + Math.round(lerp(220, 40, ten)) + "," + Math.round(lerp(228, 44, ten)) + "," + Math.round(lerp(236, 52, ten)) + "," + (0.28 + ten * 0.35) + ")";
        ctx.beginPath();
        ctx.ellipse(x, y, cw * 0.55, ch * 0.7, 0, 0, Math.PI * 2);
        ctx.ellipse(x - cw * 0.28, y + ch * 0.12, cw * 0.32, ch * 0.5, 0, 0, Math.PI * 2);
        ctx.ellipse(x + cw * 0.3, y + ch * 0.1, cw * 0.34, ch * 0.48, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      if (ten > 0.5) {
        ctx.strokeStyle = "rgba(210, 225, 240, " + ((ten - 0.5) * 0.22) + ")";
        ctx.lineWidth = 1.1 * dpr;
        for (let i = 0; i < 14; i++) {
          const x = ((i * 0.11 + timeSec * 0.18) % 1) * W;
          const y0 = (0.05 + (i % 7) * 0.07) * waterY();
          ctx.beginPath();
          ctx.moveTo(x, y0);
          ctx.lineTo(x - 8 * dpr, y0 + 16 * dpr);
          ctx.stroke();
        }
      }

      if (lightning > 0.15) {
        ctx.fillStyle = "rgba(230, 240, 255, " + (lightning * 0.28) + ")";
        ctx.fillRect(0, 0, W, waterY());
        if (bolt) {
          ctx.save();
          ctx.strokeStyle = "rgba(230, 245, 255, " + lightning + ")";
          ctx.lineWidth = 2.2 * dpr;
          ctx.shadowColor = "#cfe8ff";
          ctx.shadowBlur = 18 * dpr;
          ctx.beginPath();
          bolt.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    function drawHorizon() {
      const ten = tension();
      const base = waterY() + 2;
      const far = mixTone("#c5e4f2", "#1c222c");
      ctx.fillStyle = far;
      ctx.globalAlpha = 0.55 + ten * 0.2;
      [[0.1, 0.1, 0.085], [0.32, 0.07, 0.055], [0.76, 0.12, 0.08], [0.92, 0.08, 0.06]].forEach(([cx, half, h]) => {
        ctx.beginPath();
        ctx.moveTo((cx - half) * W, base);
        ctx.lineTo(cx * W - half * W * 0.2, base - h * H * 0.45);
        ctx.lineTo(cx * W, base - h * H);
        ctx.lineTo(cx * W + half * W * 0.25, base - h * H * 0.5);
        ctx.lineTo((cx + half) * W, base);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function wavePath(y, amp, freq, speed, phase) {
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, y);
      const steps = Math.max(28, Math.floor(W / 12));
      for (let i = 0; i <= steps; i++) {
        const x = (i / steps) * W;
        ctx.lineTo(x, y + Math.sin(x * freq + timeSec * speed + phase) * amp);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
    }

    function drawWater() {
      const y = waterY();
      const ten = tension();
      const amp = WAVE_AMP_PX * dpr;
      const speed = WAVE_SPEED;

      const deep = ctx.createLinearGradient(0, y - 12, 0, H);
      deep.addColorStop(0, mixTone("#2cb3de", "#152836"));
      deep.addColorStop(0.22, mixTone("#1a8fc4", "#0d1c28"));
      deep.addColorStop(0.55, mixTone("#0d6a96", "#081018"));
      deep.addColorStop(1, mixTone("#0a3d5c", "#020508"));
      ctx.fillStyle = deep;
      wavePath(y, amp, 0.0062 / dpr, speed, 0);
      ctx.fill();

      ctx.fillStyle = ten < 0.4
        ? "rgba(90, 210, 230, " + (0.14 - ten * 0.08) + ")"
        : "rgba(50, 90, 110, " + (ten * 0.12) + ")";
      wavePath(y + 11 * dpr, amp * 0.7, 0.011 / dpr, speed * 1.3, 1.3);
      ctx.fill();

      if (ten > 0.2) {
        ctx.fillStyle = "rgba(200, 230, 240, " + ((ten - 0.2) * 0.12) + ")";
        wavePath(y + 24 * dpr, amp * 0.42, 0.017 / dpr, speed * 1.75, 2.5);
        ctx.fill();
      }

      const steps = Math.max(30, Math.floor(W / 11));
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const x = (i / steps) * W;
        const yy = y + Math.sin(x * 0.0062 / dpr + timeSec * speed) * amp;
        if (i === 0) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.strokeStyle = ten < 0.35
        ? "rgba(210, 245, 255, 0.55)"
        : "rgba(210, 230, 240, " + (0.2 + ten * 0.35) + ")";
      ctx.lineWidth = (1.4 + ten * 1.6) * dpr;
      ctx.stroke();

      if (ten > 0.18) {
        ctx.fillStyle = "rgba(245, 252, 255, " + (0.15 + ten * 0.4) + ")";
        for (let i = 0; i < steps; i++) {
          if ((i + (timeSec * 3 | 0)) % 3 !== 0) continue;
          const x = (i / steps) * W;
          const crest = Math.sin(x * 0.0062 / dpr + timeSec * speed);
          if (crest < 0.5) continue;
          ctx.beginPath();
          ctx.ellipse(x, y + crest * amp - 1 * dpr, (5 + ten * 7) * dpr, 1.6 * dpr, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawFloeShape(f, alpha) {
      const x = ((f.x % 1) + 1) % 1 * W;
      const surface = waterY();
      const bob = Math.sin(timeSec * (0.8 + f.z) + f.phase) * (2 + f.z * 4) * dpr;
      const hw = f.w * W;
      const hh = f.h * H * (0.7 + f.z * 0.5);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, surface + bob);

      ctx.fillStyle = "rgba(20, 60, 90, 0.12)";
      ctx.beginPath();
      ctx.ellipse(0, 8 * dpr, hw * 1.05, hh * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-hw, 4);
      ctx.lineTo(-hw * (0.3 + f.jagged * 0.15), -hh * 0.5);
      ctx.lineTo(-hw * 0.08, -hh);
      ctx.lineTo(hw * 0.12, -hh * 0.72);
      ctx.lineTo(hw * (0.2 + f.jagged * 0.12), -hh * 0.95);
      ctx.lineTo(hw * 0.78, -hh * 0.32);
      ctx.lineTo(hw, 4);
      ctx.closePath();
      const ice = ctx.createLinearGradient(-hw, -hh, hw, 10);
      ice.addColorStop(0, "#f6fcff");
      ice.addColorStop(0.4, "#d4eef8");
      ice.addColorStop(1, "#7eacbf");
      ctx.fillStyle = ice;
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.beginPath();
      ctx.moveTo(-hw * 0.08, -hh);
      ctx.lineTo(hw * 0.04, -hh * 0.55);
      ctx.lineTo(-hw * 0.22, -hh * 0.4);
      ctx.fill();
      ctx.restore();
    }

    function drawFloes(near) {
      floes.forEach((f) => {
        const isNear = f.z >= 0.5;
        if (isNear !== near) return;
        drawFloeShape(f, lerp(0.55, 0.95, f.z));
      });
    }

    function bergSilhouette(hw, hh, y0) {
      y0 = y0 == null ? 4 : y0;
      ctx.beginPath();
      ctx.moveTo(-hw, y0);
      ctx.bezierCurveTo(-hw * 0.96, -hh * 0.1, -hw * 0.8, -hh * 0.22, -hw * 0.62, -hh * 0.34);
      ctx.bezierCurveTo(-hw * 0.42, -hh * 0.5, -hw * 0.3, -hh * 0.78, -hw * 0.1, -hh * 0.94);
      ctx.bezierCurveTo(-hw * 0.02, -hh * 1.02, hw * 0.12, -hh * 1.0, hw * 0.2, -hh * 0.82);
      ctx.bezierCurveTo(hw * 0.34, -hh * 0.52, hw * 0.52, -hh * 0.38, hw * 0.74, -hh * 0.24);
      ctx.bezierCurveTo(hw * 0.9, -hh * 0.12, hw * 0.98, -hh * 0.02, hw, y0);
      ctx.closePath();
    }

    function paintBerg(hw, hh, tones) {
      bergSilhouette(hw, hh, 5);
      const ice = ctx.createLinearGradient(-hw * 0.6, -hh, hw * 0.8, 12);
      ice.addColorStop(0, tones[0]);
      ice.addColorStop(0.42, tones[1]);
      ice.addColorStop(1, tones[2]);
      ctx.fillStyle = ice;
      ctx.fill();

      ctx.save();
      bergSilhouette(hw, hh, 5);
      ctx.clip();
      ctx.fillStyle = tones[3];
      ctx.beginPath();
      ctx.moveTo(hw * 0.02, -hh * 0.92);
      ctx.quadraticCurveTo(hw * 0.38, -hh * 0.4, hw * 0.92, 6);
      ctx.lineTo(hw, 8);
      ctx.lineTo(hw * 0.08, 8);
      ctx.fill();

      ctx.fillStyle = tones[4];
      ctx.beginPath();
      ctx.moveTo(-hw * 0.18, -hh * 0.88);
      ctx.quadraticCurveTo(-hw * 0.02, -hh * 0.55, hw * 0.08, -hh * 0.7);
      ctx.quadraticCurveTo(-hw * 0.04, -hh * 0.92, -hw * 0.12, -hh * 0.98);
      ctx.fill();
      ctx.restore();
    }

    function drawBonusBergs() {
      bonusEvents.forEach((ev) => {
        if (ev.phase !== "rising" && ev.phase !== "pop") return;
        const surface = waterY();
        const peakH = H * 0.11 * ev.rise;
        const hw = W * 0.026;
        ctx.save();
        ctx.translate(ev.x * W, surface);
        ctx.globalAlpha = ev.phase === "pop" ? ev.rise : 1;
        ctx.fillStyle = "rgba(80, 50, 10, 0.1)";
        ctx.beginPath();
        ctx.ellipse(0, 7 * dpr, hw * 1.05, 6 * dpr, 0, 0, Math.PI * 2);
        ctx.fill();
        paintBerg(hw, peakH, [
          "#fff4d2",
          "#e8c56a",
          "#a07828",
          "rgba(120, 80, 16, 0.22)",
          "rgba(255, 244, 210, 0.35)"
        ]);
        ctx.restore();
      });
    }

    function drawWake() {
      wake.forEach((w) => {
        const a = clamp(w.life / w.max, 0, 1);
        ctx.globalAlpha = a * 0.22;
        ctx.fillStyle = "#bfe8f4";
        ctx.beginPath();
        ctx.ellipse(w.x, w.y, w.r * dpr * (1.6 - a), w.r * dpr * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawUnderIce() {
      if (iceberg.rise <= 0.001) return;
      const surface = waterY();
      const hw = W * 0.072;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, surface, W, H - surface);
      ctx.clip();
      ctx.translate(iceberg.x * W, surface);
      ctx.scale(1, -1);
      const under = ctx.createLinearGradient(0, 0, 0, H * 0.3);
      under.addColorStop(0, "rgba(140, 186, 206, 0.28)");
      under.addColorStop(1, "rgba(50, 90, 112, 0.04)");
      ctx.fillStyle = under;
      bergSilhouette(hw * 1.08, H * 0.28 * iceberg.rise, -2);
      ctx.fill();
      ctx.restore();
    }

    function drawIceberg() {
      if (iceberg.rise <= 0.001) return;
      const surface = waterY();
      const peakH = H * 0.26 * iceberg.rise;
      const hw = W * 0.068;
      ctx.save();
      ctx.translate(iceberg.x * W, surface);

      ctx.fillStyle = "rgba(12, 36, 52, 0.12)";
      ctx.beginPath();
      ctx.ellipse(0, 8 * dpr, hw * 1.08, 7 * dpr, 0, 0, Math.PI * 2);
      ctx.fill();

      paintBerg(hw, peakH, [
        "#e8f2f6",
        "#c5d8e2",
        "#7f9eae",
        "rgba(70, 102, 118, 0.2)",
        "rgba(255, 255, 255, 0.28)"
      ]);
      ctx.restore();
    }

    function boatHull(s) {
      ctx.beginPath();
      ctx.moveTo(-s * 1.18, -s * 0.02);
      ctx.quadraticCurveTo(-s * 1.32, s * 0.1, -s * 1.02, s * 0.3);
      ctx.quadraticCurveTo(-s * 0.08, s * 0.5, s * 0.92, s * 0.24);
      ctx.quadraticCurveTo(s * 1.26, s * 0.1, s * 1.28, -s * 0.04);
      ctx.quadraticCurveTo(s * 0.15, -s * 0.16, -s * 1.18, -s * 0.02);
      ctx.closePath();
    }

    function boatSail(s, flutter, wind) {
      const belly = 0.78 + wind * 0.24 + flutter;
      const tip = 0.96 + wind * 0.16 + flutter * 0.55;
      ctx.beginPath();
      ctx.moveTo(-s * 0.1, -s * 1.58);
      ctx.quadraticCurveTo(s * belly, -s * (1.0 + wind * 0.04), s * tip, -s * 0.3);
      ctx.quadraticCurveTo(s * 0.42, -s * 0.2, -s * 0.08, -s * 0.26);
      ctx.closePath();
    }

    function drawSailboat(s, ghost) {
      const wind = sailWind();
      const flutter = Math.sin(timeSec * 1.65) * (0.03 + wind * 0.04)
        + Math.sin(timeSec * 2.8 + 0.6) * (0.015 + wind * 0.02);
      if (ghost) {
        ctx.fillStyle = "#152838";
        boatSail(s, 0, wind);
        ctx.fill();
        boatHull(s);
        ctx.fill();
        return;
      }

      ctx.fillStyle = "rgba(10, 28, 40, 0.12)";
      ctx.beginPath();
      ctx.ellipse(0, s * 0.16, s * 1.12, s * 0.07, 0, 0, Math.PI * 2);
      ctx.fill();

      boatSail(s, flutter, wind);
      const sail = ctx.createLinearGradient(-s * 0.2, -s * 1.55, s * 1.05, -s * 0.15);
      sail.addColorStop(0, "#f7f0e4");
      sail.addColorStop(1, "#d8c4a4");
      ctx.fillStyle = sail;
      ctx.fill();

      ctx.strokeStyle = "#3d2a1c";
      ctx.lineCap = "round";
      ctx.lineWidth = Math.max(1.6, s * 0.055);
      ctx.beginPath();
      ctx.moveTo(-s * 0.1, s * 0.02);
      ctx.lineTo(-s * 0.08, -s * 1.58);
      ctx.stroke();
      ctx.lineWidth = Math.max(1.2, s * 0.038);
      ctx.beginPath();
      ctx.moveTo(-s * 0.08, -s * 0.24);
      ctx.lineTo(s * 0.96, -s * 0.28);
      ctx.stroke();

      boatHull(s);
      const hull = ctx.createLinearGradient(0, -s * 0.16, 0, s * 0.48);
      hull.addColorStop(0, "#c48a58");
      hull.addColorStop(0.45, "#8b5534");
      hull.addColorStop(1, "#4e2f1c");
      ctx.fillStyle = hull;
      ctx.fill();

      ctx.save();
      boatHull(s);
      ctx.clip();
      ctx.strokeStyle = "rgba(60, 32, 16, 0.22)";
      ctx.lineWidth = Math.max(1, s * 0.018);
      for (let i = 0; i < 3; i++) {
        const y = s * (0.06 + i * 0.1);
        ctx.beginPath();
        ctx.moveTo(-s * 1.15, y);
        ctx.quadraticCurveTo(0, y + s * 0.04, s * 1.15, y - s * 0.02);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(232, 198, 150, 0.55)";
      ctx.fillRect(-s * 1.3, -s * 0.04, s * 2.6, s * 0.045);
      ctx.restore();
    }

    function drawShip() {
      const x = ship.x * W;
      const y = waterY() + ship.heave + ship.sink * H * 0.08;
      const s = Math.min(W, H) * 0.07;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ship.pitch + ship.rot);
      ctx.save();
      ctx.scale(1, -0.34);
      ctx.globalAlpha = 0.12;
      drawSailboat(s, true);
      ctx.restore();
      drawSailboat(s, false);
      ctx.restore();
    }

    function drawParticles() {
      particles.forEach((p) => {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        ctx.fillStyle = p.gold ? "#ffd56a" : "#c9eef6";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * dpr, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawVignette() {
      const ten = tension();
      const g = ctx.createRadialGradient(W * 0.5, H * 0.48, H * 0.2, W * 0.5, H * 0.5, H * 0.92);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(8, 18, 28, " + (0.12 + ten * 0.42) + ")");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function draw() {
      ctx.save();
      if (shake > 0.35) {
        ctx.translate((Math.random() - 0.5) * shake * dpr, (Math.random() - 0.5) * shake * dpr);
      }
      drawSky();
      drawHorizon();
      drawFloes(false);
      drawUnderIce();
      drawWater();
      drawFloes(true);
      drawWake();
      drawShip();
      drawBonusBergs();
      drawIceberg();
      drawParticles();
      drawVignette();
      ctx.restore();
    }

    // ---------------------------------------------------------------------------
    // LOOP
    // ---------------------------------------------------------------------------
    function spawnBolt() {
      const pts = [];
      let x = W * (0.25 + Math.random() * 0.5);
      let y = 0;
      pts.push([x, y]);
      while (y < waterY() * 0.85) {
        x += (Math.random() - 0.55) * 36 * dpr;
        y += 18 + Math.random() * 28 * dpr;
        pts.push([x, y]);
      }
      return pts;
    }

    function updateFloes(dt) {
      const ten = tension();
      floes.forEach((f) => {
        f.x -= f.speed * dt * 0.35;
        if (f.x < -0.12) f.x = 1.08;
      });
      clouds.forEach((c) => {
        c.x -= c.speed * dt * 0.4;
        if (c.x < -0.2) c.x = 1.15;
      });
      if (state === STATE.RUNNING && ten > 0.58 && Math.random() < 0.015 * ten) {
        lightning = 1;
        bolt = spawnBolt();
      }
      lightning *= Math.pow(0.04, dt);
    }

    function updateBonusEvents(now) {
      bonusEvents.forEach((ev) => {
        if (ev.phase === "idle" && currentMultiplier >= ev.at) {
          ev.phase = "rising";
          ev.since = now;
          ev.x = clamp(ship.x + 0.08, 0.22, 0.84);
          ev.rise = 0;
        }
        if (ev.phase === "rising") {
          ev.rise = clamp((now - ev.since) / 360, 0, 1);
          if (ev.rise >= 1) {
            ev.phase = "pop";
            ev.since = now;
            applyBonus(ev);
          }
        } else if (ev.phase === "pop") {
          ev.rise = 1 - clamp((now - ev.since) / 260, 0, 1);
          if (ev.rise <= 0) ev.phase = "done";
        }
      });
    }

    function update(now, dt) {
      timeSec = now / 1000;
      shake *= Math.pow(0.035, dt);
      updateShipRide(dt);
      updateParticles(dt);
      updateFloes(dt);

      balanceShown += (balance - balanceShown) * Math.min(1, dt * 9);
      if (Math.abs(balance - balanceShown) < 0.015) balanceShown = balance;
      balanceEl.textContent = formatMoney(balanceShown);

      if (state === STATE.BETTING) {
        ship.x = shipHome();
        iceberg.rise = 0;
        if ((now / 150 | 0) !== ((now - dt * 1000) / 150 | 0)) spawnSailingWake();
      }

      if (state === STATE.RUNNING) {
        const elapsedMs = Math.max(0, now - roundStartMs);
        const climbed = Math.pow(CLIMB_BASE, elapsedMs);
        const autoAt = parseAuto();

        const progress = 1 - Math.exp(-elapsedMs / 4800);
        ship.x = lerp(shipHome(), 0.64, progress) + Math.sin(elapsedMs / 620) * 0.007;
        ship.rot = 0;
        ship.sink = 0;
        iceberg.rise = 0;

        if ((now / 32 | 0) !== ((now - dt * 1000) / 32 | 0)) {
          spawnSailingWake();
          const ten = tension();
          if (ten > 0.75 && Math.random() < 0.08) {
            particles.push({
              x: Math.random() * W,
              y: waterY() - 4,
              vx: 24 * (Math.random() < 0.5 ? -1 : 1),
              vy: -18 - Math.random() * 22,
              life: 0.28 + Math.random() * 0.25,
              max: 0.5,
              r: 1 + Math.random() * 2,
              gold: false
            });
          }
        }

        if (climbed >= crashMultiplier) {
          if (autoAt > 0 && autoAt < crashMultiplier) {
            currentMultiplier = autoAt;
            cashOut();
          } else {
            currentMultiplier = crashMultiplier;
            triggerCrash();
          }
        } else if (autoAt > 0 && climbed >= autoAt) {
          currentMultiplier = autoAt;
          cashOut();
        } else {
          currentMultiplier = climbed;
        }

        if (state === STATE.RUNNING) {
          updateBonusEvents(now);
          updateLiveBets(currentMultiplier, false);
          updateRiseTone(currentMultiplier);
          multEl.textContent = formatMult(currentMultiplier);
          setMultLook();
          paintAction();
        }
      }

      if (state === STATE.CRASHED) {
        const t = (now - stateSinceMs) / ICEBERG_RISE_MS;
        iceberg.rise = clamp(easeOutBack(clamp(t, 0, 1)), 0, 1.12);
        if (!splashSpawned && iceberg.rise > 0.22) {
          splashSpawned = true;
          spawnSplash(iceberg.x * W, waterY());
          shake = SHAKE_START;
        }
        const hit = clamp((now - stateSinceMs - 150) / 500, 0, 1);
        ship.rot = hit * 0.75;
        ship.sink = easeOutCubic(hit);
        ship.x = lerp(ship.x, iceberg.x - 0.055, hit * 0.1);
        if (now - stateSinceMs > ICEBERG_RISE_MS + POST_ROUND_PAUSE_MS) returnToBetting();
      }

      if (state === STATE.WON) {
        const t = clamp((now - stateSinceMs) / ESCAPE_MS, 0, 1);
        ship.x = lerp(animFromX, 1.22, easeOutCubic(t));
        ship.rot = Math.sin(timeSec * 2.3) * 0.035;
        ship.sink = -0.02 * Math.sin(Math.min(1, t * 1.8) * Math.PI);
        iceberg.rise = 0;
        if ((now / 28 | 0) !== ((now - dt * 1000) / 28 | 0)) spawnSailingWake();
        if (now - stateSinceMs > ESCAPE_MS + POST_ROUND_PAUSE_MS * 0.6) returnToBetting();
      }
    }

    function loop(now) {
      resize();
      if (!lastTs) lastTs = now;
      const dt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;
      update(now, dt);
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    ship.x = shipHome();
    seedFloes();
    seedClouds();
    setHud();
    renderHistory();
    seedLiveBets();
    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
